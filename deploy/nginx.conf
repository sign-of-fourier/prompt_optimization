# Three hosts, one box.  Install as /etc/nginx/sites-available/sites, symlink into sites-enabled, then
#   sudo nginx -t && sudo systemctl reload nginx
# Certificates: after each domain's DNS points here,
#   sudo certbot --nginx -d quantecarlo.com -d www.quantecarlo.com
#   sudo certbot --nginx -d promptcompression.ai -d www.promptcompression.ai
#   sudo certbot --nginx -d impromptune.com -d www.impromptune.com
# certbot rewrites the `listen 443` lines and adds the ssl_* directives; keep this file as the source of truth for
# everything else. A host whose DNS has not moved yet is harmless: nginx just never receives requests for it.
#
# Web roots are the repo's site directories. The studio's code, sqlite database and keys live outside every root.

# The marketing hosts share /etc/nginx/snippets/marketing.conf (deploy/snippets-marketing.conf in the repo).

# --- www -> apex, http -> https ---------------------------------------------------------------------------------

server {
    listen 80;
    server_name quantecarlo.com www.quantecarlo.com promptcompression.ai www.promptcompression.ai impromptune.com www.impromptune.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name www.quantecarlo.com;
    return 301 https://quantecarlo.com$request_uri;
}
server {
    listen 443 ssl;
    server_name www.promptcompression.ai;
    return 301 https://promptcompression.ai$request_uri;
}
server {
    listen 443 ssl;
    server_name www.impromptune.com;
    return 301 https://impromptune.com$request_uri;
}

# --- quantecarlo.com: the optimizer and the company -------------------------------------------------------------

server {
    listen 443 ssl;
    server_name quantecarlo.com;
    root /home/ubuntu/projects/prompt_optimization/quantecarlo;
    include /etc/nginx/snippets/marketing.conf;
}

# --- promptcompression.ai: content marketing --------------------------------------------------------------------

server {
    listen 443 ssl;
    server_name promptcompression.ai;
    root /home/ubuntu/projects/prompt_optimization/compression;
    include /etc/nginx/snippets/marketing.conf;

    # the studio used to live here; keep every old link working
    location /studio/ { return 301 https://impromptune.com$request_uri; }
    location = /studio { return 301 https://impromptune.com/; }
}

# --- impromptune.com: the studio --------------------------------------------------------------------------------
# Build the frontend for the root path:  (cd studio/web && VITE_STUDIO_BASE=/ npm run build)

server {
    listen 443 ssl;
    server_name impromptune.com;
    root /home/ubuntu/projects/prompt_optimization/studio/web/dist;
    charset utf-8;

    location /api/ {
        proxy_pass http://127.0.0.1:8100/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        client_max_body_size 50m;
    }
    # Hashed assets can be cached forever; index.html must always be revalidated or browsers keep an old bundle
    # after a deploy (add_header inside a location replaces, not extends, any add_header above it).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
