[project]
name = "studio"
version = "0.1.0"
description = "Point-and-click studio for bpto: build a program graph, validate data, run GEPA/BO, watch the tree."
requires-python = ">=3.12"
dependencies = [
    "bpto @ git+https://github.com/sign-of-fourier/bpto@bb2313a",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
