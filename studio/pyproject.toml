[project]
name = "studio"
version = "0.1.0"
description = "Point-and-click studio for bpto: build a program graph, validate data, run GEPA/BO, watch the tree."
requires-python = ">=3.12"
dependencies = [
    "bpto @ git+https://github.com/sign-of-fourier/bpto@41406ae",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "python-multipart",
    "cryptography",   # encrypts the keys and connections users store (credentials.py)
    "boto3",   # Bedrock (house models); bpto imports it lazily, so a fresh machine only fails at the first call
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
