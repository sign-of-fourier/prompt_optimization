# Add inside the `server { server_name promptcompression.ai; ... }` block (port 443) in
# /etc/nginx/sites-enabled/promptcompression, and change its root:
#
#     root /home/ubuntu/projects/prompt_optimization/compression;
#
# Then: sudo nginx -t && sudo systemctl reload nginx
# The studio's own code, database and keys live outside the web root and are never served.

location /studio/api/ {
    proxy_pass http://127.0.0.1:8100/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 600s;
    client_max_body_size 50m;
}
location /studio/ {
    alias /home/ubuntu/projects/prompt_optimization/studio/web/dist/;
    try_files $uri $uri/ /studio/index.html;
}
